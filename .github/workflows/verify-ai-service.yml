name: Verify Python AI Service

on:
  push:
    branches: [main, 'feat/4.0-*']
  pull_request:
    branches: [main, 'feat/4.0-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ai-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run service tests
        run: pytest -q
      - name: Build service container
        run: docker build -t yks-takip-ai-service:test .
