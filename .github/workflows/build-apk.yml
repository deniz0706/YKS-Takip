name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - '2.0'

permissions:
  contents: write

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      # Android would otherwise generate a different debug certificate on
      # every ephemeral runner, so installed previews could never be updated.
      # This is only a temporary development fallback: caches can be evicted.
      - name: Restore preview debug signing key
        id: preview_signing_cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: yks-takip-2-0-debug-signing-linux-v1

      - name: Prepare preview debug signing
        env:
          PREVIEW_DEBUG_KEYSTORE_B64: ${{ secrets.YKS_PREVIEW_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$PREVIEW_DEBUG_KEYSTORE_B64" ]; then
            printf '%s' "$PREVIEW_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            echo "Using repository-secret signing key."
          elif [ -s "$HOME/.android/debug.keystore" ]; then
            echo "Using cached development signing key."
          else
            echo "::warning::No permanent signing key configured. A new debug key will be generated and cached. GitHub may evict caches after inactivity."
          fi

      - name: Build APK
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Report APK signing fingerprint
        run: |
          # Never publish the private key. Only the public certificate hash.
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep 'SHA256:'
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YKS-Takip-Debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: YKS-Takip-Release-Unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Publish 2.0 preview release
        if: github.ref == 'refs/heads/2.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.0-preview"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "YKS Takip 2.0 · Önizleme" --prerelease --latest=false
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "YKS Takip 2.0 · Önizleme" --notes "Jetpack Compose arayüzünün geliştirme önizlemesi. Hatalar ve performans sorunları olabilir. Mevcut kayıtlarınızı yedekleyin." --prerelease --latest=false
          fi
          gh release upload "$TAG" "$APK#YKS-Takip-2.0-preview-debug.apk" --clobber
