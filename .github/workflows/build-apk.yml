name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - '2.0'
      - '4.0/**'

permissions:
  contents: write

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Only trusted branch pushes/maintainer dispatches trigger this workflow.
    cache-mode: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      # Keep the stable preview key when available. A missing key must not
      # prevent tests and unsigned release compilation from running.
      - name: Restore preview debug signing key
        id: preview_signing_cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: yks-takip-2-0-debug-signing-linux-v1

      - name: Prepare preview debug signing
        id: preview_signing
        env:
          PREVIEW_DEBUG_KEYSTORE_B64: ${{ secrets.YKS_PREVIEW_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$PREVIEW_DEBUG_KEYSTORE_B64" ]; then
            printf '%s' "$PREVIEW_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            echo "Using repository-secret signing key."
          elif [ -s "$HOME/.android/debug.keystore" ]; then
            echo "Using cached development signing key."
          else
            echo "::warning::Stable preview signing key is unavailable. Build and tests will continue, but no debug APK will be published because its signature cannot be guaranteed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          chmod 600 "$HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"
          echo "YKS_PREVIEW_DEBUG_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - name: Report APK signing fingerprint
        if: steps.preview_signing.outputs.ready == 'true'
        run: |
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APK_SIGNER" ]; then
            echo "::error::Android SDK apksigner was not installed."
            exit 1
          fi
          SIGNER_REPORT="$("$APK_SIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk)"
          printf '%s\n' "$SIGNER_REPORT" | grep -Ei 'SHA-256|SHA256'
          EXPECTED="de8b0df1be51947b5c0afe7a19a5bfe4e8bfc5f3cf923f4cb4c493e423ab3f69"
          CERT="$(printf '%s\n' "$SIGNER_REPORT" | sed -nE 's/^.*certificate SHA-256 digest: ([[:xdigit:]]{64}).*/\1/p' | tr '[:upper:]' '[:lower:]' | tr -d '\r')"
          if [ -z "$CERT" ] || [ "$CERT" != "$EXPECTED" ]; then
            echo "::error::Preview signing certificate changed or could not be read. Expected: $EXPECTED. Got: ${CERT:-missing}. Refusing to publish an incompatible APK."
            exit 1
          fi
          echo "Preview signature unchanged."

      - name: Upload debug APK
        if: steps.preview_signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: YKS-Takip-Debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: YKS-Takip-Release-Unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Publish 4.0 preview release
        if: startsWith(github.ref, 'refs/heads/4.0/') && steps.preview_signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v4.0-preview"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "YKS Takip 4.0 · Önizleme" --prerelease --latest=false
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "YKS Takip 4.0 · Önizleme" --notes "YKS Takip 4.0 Android geliştirme önizlemesi. Hatalar ve performans sorunları olabilir. Mevcut kayıtlarınızı yedekleyin." --prerelease --latest=false
          fi
          gh release upload "$TAG" "$APK" --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx 'app-debug.apk'
