name: Verify iOS Build

on:
  push:
    branches:
      - 'feat/4.0-*'
      - 'main'
  pull_request:
    branches:
      - 'feat/4.0-*'
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Xcode command-line tools (if needed)
        run: |
          xcode-select --version || xcode-select --install

      - name: Verify Kotlin Multiplatform iOS target compilation
        run: |
          echo "Verifying domain KMP module compiles for iOS targets..."
          gradle :domain:compileKotlinIosX64 :domain:compileKotlinIosArm64 --no-daemon || \
          gradle :domain:compileKotlinMetadata --no-daemon

      - name: Report KMP target status
        run: |
          echo "iOS targets verified on macOS."
          echo "Note: Full iOS framework export requires Xcode 15+ and a valid provisioning profile for device deployment."
