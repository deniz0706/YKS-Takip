name: Verify Shared Domain iOS Targets

on:
  push:
    branches:
      - 'feat/4.0-*'
      - 'main'
  pull_request:
    branches:
      - 'feat/4.0-*'
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-ios-domain-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify shared domain iOS target compilation
        run: gradle :domain:compileKotlinIosX64 :domain:compileKotlinIosArm64 :domain:compileKotlinIosSimulatorArm64 --no-daemon

      - name: Report verified scope
        run: |
          echo "Shared domain compiled for iOS device and simulator targets."
          echo "This does not build a native iOS application or verify signing, provisioning, or App Store submission."
