name: Verify Android Build

on:
  push:
    branches:
      - '2.0'
      - 'feature/nvidia-ai-coach'
      - 'v3.0-test/product-foundation'
      - 'v3.0/ui-foundation'
      - 'integration/complete-mainline'
      - 'feat/4.0-*'
      - 'main'
  pull_request:
    branches:
      - '2.0'
      - 'main'
      - 'feat/4.0-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Launch app and run Android UI smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: gradle --no-daemon connectedDebugAndroidTest assembleDebug
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yks-takip-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
