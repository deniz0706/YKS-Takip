name: Verify Android Build

on:
  push:
    branches:
      - '2.0'
      - 'feature/nvidia-ai-coach'
      - 'v3.0-test/product-foundation'
      - 'v3.0/ui-foundation'
      - 'integration/complete-mainline'
  pull_request:
    branches:
      - '2.0'
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run unit tests and build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
