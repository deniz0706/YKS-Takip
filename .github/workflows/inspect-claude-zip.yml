name: Import Claude UI Review
on:
  push:
    branches: [review]
    paths:
      - '.github/workflows/inspect-claude-zip.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review
      - name: Extract and import reviewed UI files
        run: |
          set -euo pipefail
          mkdir /tmp/claude
          unzip -q YKS-Takip-main-ui-v1.zip -d /tmp/claude
          ROOT="$(find /tmp/claude -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$ROOT"
          cp "$ROOT/app/src/main/java/com/deniz0706/ykstakip/ui/home/HomeScreenV2.kt" app/src/main/java/com/deniz0706/ykstakip/ui/home/HomeScreenV2.kt
          cp "$ROOT/app/src/main/java/com/deniz0706/ykstakip/ui/home/HomeInsights.kt" app/src/main/java/com/deniz0706/ykstakip/ui/home/HomeInsights.kt
          cp "$ROOT/app/src/main/java/com/deniz0706/ykstakip/ui/components/YksHomeComponents.kt" app/src/main/java/com/deniz0706/ykstakip/ui/components/YksHomeComponents.kt
          cp "$ROOT/app/src/main/java/com/deniz0706/ykstakip/ui/theme/YksTypography.kt" app/src/main/java/com/deniz0706/ykstakip/ui/theme/YksTypography.kt
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/deniz0706/ykstakip/ui/home/HomeScreenV2.kt app/src/main/java/com/deniz0706/ykstakip/ui/home/HomeInsights.kt app/src/main/java/com/deniz0706/ykstakip/ui/components/YksHomeComponents.kt app/src/main/java/com/deniz0706/ykstakip/ui/theme/YksTypography.kt
          if git diff --cached --quiet; then
            echo "No source changes to import."
            exit 0
          fi
          git commit -m "Import Claude home UI redesign for review"
          git push origin HEAD:review
